[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harmony-mind-backend"
version = "0.1.0"
description = "HarmonyMind backend scaffold"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110,<1.0",
  "sqlmodel>=0.0.16,<1.0",
  "uvicorn[standard]>=0.29,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["app*"]
